<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#12151e">
  <title>PracticeKeys</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="bar-group bar-left">
        <div class="song-picker" id="songPicker">
          <button id="songBtn" class="pill-btn" aria-label="Songs" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="16" r="3"/>
            </svg>
            <span id="songTitle" class="song-title"></span>
            <svg class="icon icon-xs chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div id="songMenu" class="song-menu" hidden>
            <div id="songList" class="song-list"></div>
          </div>
        </div>

        <button id="uploadBtn" class="icon-btn" aria-label="Upload">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </button>
        <input id="fileInput" type="file" accept=".mid,.midi,.musicxml,.xml,.mxl,.abc,.json,.txt" multiple hidden>

        <button id="recordBtn" class="icon-btn record-btn" aria-label="Record">
          <span class="rec-dot"></span>
        </button>
      </div>

      <div class="bar-group bar-center">
        <button id="restartBtn" class="icon-btn" aria-label="Restart">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"/>
            <line x1="5" y1="19" x2="5" y2="5"/>
          </svg>
        </button>

        <button id="playBtn" class="icon-btn primary-btn" aria-label="Play">
          <svg id="playIcon" class="icon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="7 4 20 12 7 20 7 4"/>
          </svg>
          <svg id="pauseIcon" class="icon" viewBox="0 0 24 24" fill="currentColor" hidden>
            <rect x="6" y="4" width="4" height="16" rx="1"/>
            <rect x="14" y="4" width="4" height="16" rx="1"/>
          </svg>
        </button>

        <button id="loopBtn" class="icon-btn" aria-label="Loop">
          <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 2 21 6 17 10"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 22 3 18 7 14"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>

        <button id="learnBtn" class="icon-btn" aria-label="Learn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 11V6a2 2 0 0 0-4 0v4"/>
            <path d="M14 10V4a2 2 0 0 0-4 0v6"/>
            <path d="M10 10.5V6a2 2 0 0 0-4 0v8"/>
            <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.8-5.9-2.2L3.3 17a2 2 0 0 1 2.8-2.8L8 16"/>
          </svg>
        </button>

        <div class="speed-wrap">
          <svg class="icon icon-sm speed-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 14l4-4"/>
            <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
          </svg>
          <input id="speedSlider" class="slider" type="range" min="0.2" max="1.5" step="0.05" value="1" aria-label="Speed">
        </div>
      </div>

      <div class="bar-group bar-right">
        <div class="seg-group">
          <button id="leftHandBtn" class="icon-btn hand-btn hand-left active" aria-label="Left Hand">
            <span class="hand-dot"></span>
          </button>
          <button id="rightHandBtn" class="icon-btn hand-btn hand-right active" aria-label="Right Hand">
            <span class="hand-dot"></span>
          </button>
        </div>

        <div class="seg-group">
          <button id="zoomOutBtn" class="icon-btn" aria-label="Zoom Out">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="6" y1="12" x2="18" y2="12"/>
            </svg>
          </button>
          <button id="fullScaleBtn" class="icon-btn" aria-label="Scale Piano">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 3 21 3 21 9"/>
              <polyline points="9 21 3 21 3 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/>
              <line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
          </button>
          <button id="zoomInBtn" class="icon-btn" aria-label="Zoom In">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="6" x2="12" y2="18"/>
              <line x1="6" y1="12" x2="18" y2="12"/>
            </svg>
          </button>
        </div>

        <button id="muteBtn" class="icon-btn" aria-label="Sound">
          <svg id="soundOnIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="soundOffIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>

        <span id="midiDot" class="midi-dot" hidden></span>
      </div>
    </header>

    <div id="progressWrap" class="progress-wrap">
      <div id="progressTrack" class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
        <div id="progressThumb" class="progress-thumb"></div>
      </div>
    </div>

    <main id="stage">
      <canvas id="canvas"></canvas>
    </main>

    <div id="dropOverlay" class="drop-overlay" hidden>
      <div class="drop-ring">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
    </div>
  </div>

  <script defer src="js/audio.js"></script>
  <script defer src="js/parsers.js"></script>
  <script defer src="js/songs.js"></script>
  <script defer src="js/midi.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
